# Render Blueprint for the API and its Postgres database. See docs/deploy.md.
databases:
  - name: ticketapp-db
    databaseName: ticketapp
    user: ticketapp
    # Free databases expire after 30 days; move to a paid plan before real events.
    plan: free

services:
  - type: web
    name: ticketapp-api
    runtime: node
    plan: free
    # Dev dependencies are needed to build, so install them despite NODE_ENV=production.
    buildCommand: >-
      npx --yes pnpm@10.28.0 install --frozen-lockfile --prod=false &&
      npx --yes pnpm@10.28.0 turbo run build --filter=@ticketapp/api
    # Migrations run on start so they work on every plan (pre-deploy commands are paid-only).
    startCommand: >-
      (cd packages/db && ../../node_modules/.bin/prisma migrate deploy) &&
      node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render's load balancer appends the client IP; trust only that hop.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: ticketapp-db
          property: connectionString
      # Dashboard URL (from Vercel), used in sign-in links and for CORS.
      - key: WEB_BASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      # Secret the door app's sign-in codes are hashed with; Render generates it once.
      - key: SIGN_IN_CODE_KEY
        generateValue: true
      # Free Render services block outbound SMTP, so email goes over Resend's HTTPS API.
      # On a paid plan, SMTP_URL can be used instead (see docs/deploy.md).
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: TicketApp <no-reply@mail.myschooltix.com>
      # Stripe Connect platform key; payments stay switched off until it's set.
      - key: STRIPE_SECRET_KEY
        sync: false
      # Twilio, for texting guardians their waiver link; until all three are set, only email is offered.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
